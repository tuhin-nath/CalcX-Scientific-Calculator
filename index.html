<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalcX - Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Header Section -->

    <header>

        <h1>CalcX</h1>

        <p>Modern Scientific Calculator</p>

        <button id="theme-btn">
            🌙 Dark Mode
        </button>

    </header>



    <!-- Main Calculator -->

    <main>


        <section class="calculator">


            <!-- Display -->

            <div class="display">

                <div id="previous-value">
                    
                </div>


                <div id="current-value">
                    0
                </div>

            </div>



            <!-- Scientific Buttons -->

            <div class="scientific-buttons">


                <button onclick="scientificFunction('sin')">
                    sin
                </button>


                <button onclick="scientificFunction('cos')">
                    cos
                </button>


                <button onclick="scientificFunction('tan')">
                    tan
                </button>


                <button onclick="scientificFunction('sqrt')">
                    √
                </button>


                <button onclick="scientificFunction('log')">
                    log
                </button>


                <button onclick="scientificFunction('ln')">
                    ln
                </button>


                <button onclick="insertValue('Math.PI')">
                    π
                </button>


                <button onclick="insertValue('Math.E')">
                    e
                </button>


                <button onclick="insertValue('**')">
                    xʸ
                </button>


            </div>




            <!-- Calculator Buttons -->


            <div class="buttons">


                <button class="operator" onclick="clearDisplay()">
                    C
                </button>


                <button class="operator" onclick="deleteNumber()">
                    DEL
                </button>


                <button class="operator" onclick="insertValue('%')">
                    %
                </button>


                <button class="operator" onclick="insertValue('/')">
                    ÷
                </button>




                <button onclick="insertValue('7')">
                    7
                </button>


                <button onclick="insertValue('8')">
                    8
                </button>


                <button onclick="insertValue('9')">
                    9
                </button>


                <button class="operator" onclick="insertValue('*')">
                    ×
                </button>




                <button onclick="insertValue('4')">
                    4
                </button>


                <button onclick="insertValue('5')">
                    5
                </button>


                <button onclick="insertValue('6')">
                    6
                </button>


                <button class="operator" onclick="insertValue('-')">
                    -
                </button>





                <button onclick="insertValue('1')">
                    1
                </button>


                <button onclick="insertValue('2')">
                    2
                </button>


                <button onclick="insertValue('3')">
                    3
                </button>


                <button class="operator" onclick="insertValue('+')">
                    +
                </button>





                <button onclick="insertValue('0')">
                    0
                </button>


                <button onclick="insertValue('.')">
                    .
                </button>


                <button class="equal" onclick="calculate()">
                    =
                </button>


            </div>



        </section>




        <!-- History Section -->


        <section class="history">


            <h2>
                Calculation History
            </h2>


            <ul id="history-list">

            </ul>


            <button onclick="clearHistory()">
                Clear History
            </button>


        </section>



    </main>





    <!-- Footer -->

    <footer>

        <p>
            Created by Shaan | CalcX Project
        </p>

    </footer>




<script src="script.js"></script>


</body>

</html>
